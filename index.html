html, body{

/* ===== Visual SEO Styles ===== */
:root{
  --brand:#5ee1ff;
  --glow:0 0 12px rgba(94,225,255,.65), 0 0 32px rgba(155,255,183,.35);
  --shadow:0 10px 30px rgba(0,0,0,.4);
}

/* Static Menu */
#staticMenu{
  position:fixed;
  left:12px;
  top:12px;
  z-index:9999;
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 14px;
  border-radius:12px;
  background:linear-gradient(135deg, rgba(20,20,28,.9), rgba(20,20,28,.6));
  border:1px solid rgba(94,225,255,.35);
  color:#e8f3ff;
  box-shadow:var(--glow), var(--shadow);
  font-size:14px;
  animation:menuEnter .6s ease .15s both;
}
#staticMenu a{
  color:#5ee1ff;
  font-weight:800;
  text-decoration:none;
}
#closeStaticMenu{
  color:#f55;
  cursor:pointer;
  padding:2px 6px;
  border-radius:6px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
}
@keyframes menuEnter{
  from{opacity:0; transform:translateY(-8px)}
  to{opacity:1; transform:translateY(0)}
}

/* Rotating Widget */
#staticSlideMenu{
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:9999;
  width:100px;
  height:100px;
  pointer-events:none;
  opacity:0;
  transform:translateX(140px) scale(.96);
}
#staticSlideMenu a{
  display:block;
  width:100%;
  height:100%;
}
#staticSlideMenu img{
  width:100%;
  height:100%;
  object-fit:contain;
  transition:opacity .25s ease;
}
.slide-in{animation:slideIn 2s ease forwards}
.slide-out{animation:slideOut 2s ease forwards}
@keyframes slideIn{
  from{opacity:0; transform:translateX(140px) scale(.96)}
  to{opacity:1; transform:translateX(0) scale(1)}
}
@keyframes slideOut{
  from{opacity:1; transform:translateX(0) scale(1)}
  to{opacity:0; transform:translateX(140px) scale(.96)}
}

.seo-hidden{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(1px,1px,1px,1px);
  white-space:nowrap;
}

<script>
/* Leave Warning */
window.onbeforeunload = () => "Are you sure you want to leave? Your session may be interrupted.";

/* ===== Unity Config (NO BROTLI for GitHub Pages) ===== */
const buildUrl = "Build";
const config = {
  dataUrl: buildUrl + "/Dune.data",
  frameworkUrl: buildUrl + "/Dune.framework.js",
  codeUrl: buildUrl + "/Dune.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "CloneDuneDEV",
  productVersion: "1.0"
};

const canvas = document.querySelector("#unity-canvas");
const loader = document.createElement("script");
loader.src = buildUrl + "/Dune.loader.js";
loader.onload = () => {
  createUnityInstance(canvas, config).catch(console.error);
};
document.body.appendChild(loader);

/* ===== Static Menu Logic ===== */
(function(){
  const menu = document.getElementById("staticMenu");
  const btn  = document.getElementById("closeStaticMenu");
  const KEY  = "sq931_staticMenu_hidden_until";

  function show(){ menu.style.display="flex"; }
  function hide(){
    menu.style.display="none";
    const until = Date.now()+180000;
    localStorage.setItem(KEY,String(until));
    setTimeout(show,180000);
  }

  const until=parseInt(localStorage.getItem(KEY)||"0",10);
  if(until && Date.now()<until){
    menu.style.display="none";
    setTimeout(show, until-Date.now());
  }

  btn.onclick=hide;
})();

/* ===== Rotator ===== */
(function(){
  const wrap=document.getElementById("staticSlideMenu");
  const a=document.getElementById("staticSlideLink");
  const img=document.getElementById("staticSlideImg");

  const ROT=[
    {
      src:"https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/GoogleForm.png",
      link:"https://sites.google.com/view/staticquasar931/google-form"
    },
    {
      src:"https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/Join_Our_DC_StaticQuassar931_lcplrf.png",
      link:"https://discord.gg/DP2hM7RRhR"
    },
    {
      src:"https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/Follow-us--IG",
      link:"https://www.instagram.com/freeschoolgamepage/"
    }
  ];

  ROT.forEach(o=>{const p=new Image();p.src=o.src;});

  let i=0;
  function delay(ms){return new Promise(r=>setTimeout(r,ms));}
  function apply(o){
    a.href=o.link;
    img.style.opacity="0";
    setTimeout(()=>{img.src=o.src;},80);
    img.onload=()=>{img.style.opacity="1";}
  }

  (async function(){
    for(;;){
      apply(ROT[i]);
      wrap.style.pointerEvents="auto";
      wrap.classList.remove("slide-out");
      wrap.classList.add("slide-in");
      await delay(7000);
      wrap.classList.remove("slide-in");
      wrap.classList.add("slide-out");
      await delay(2000);
      wrap.style.pointerEvents="none";
      await delay(20000);
      i=(i+1)%ROT.length;
    }
  })();
})();

/* y+u+i toggle */
(function(){
  const ids=["staticMenu","staticSlideMenu"];
  let seq=[];
  window.addEventListener("keydown",e=>{
    seq.push(e.key.toLowerCase());
    if(seq.length>3) seq.shift();
    if(seq.join("")==="yui"){
      ids.forEach(id=>{
        const el=document.getElementById(id);
        const hidden=(getComputedStyle(el).display==="none");
        el.style.display=hidden?(id==="staticMenu"?"flex":"block"):"none";
      });
    }
  });
})();
</script>
