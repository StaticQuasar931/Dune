  <!-- Yandex Games SDK wrapper (your local file) -->
  <script src="./sdk.js"></script>

  <style>
    canvas:focus { outline: none; }
    html, body {
      padding: 0;
      margin: 0;
      overflow: hidden;

      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 99999;
      padding: 10px 12px;
      border-radius: 10px;
      font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="fatal"></div>

  <script>
    window.onbeforeunload = () => "Are you sure you want to leave? Your session may be interrupted.";

    const hideFullScreenButton = "";
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Dune.loader.js";

    const configBase = {
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "CloneDuneDEV",
      productVersion: "1.0"
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector(".spinner");
    const fatal = document.querySelector("#fatal");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    loadingCover.style.background = "url('Images/background.jpg') center / cover";
    loadingCover.style.display = "";

    let StartUnityInstance;
    let ygGameInstance = null;
    let ysdk = null;
    let initYSDK = false;
    let initGame = false;
    let syncInit = false;
    let isVisibility = true;
    let isPausedGame = false;
    const NO_DATA = "no data";

    function showFatal(msg) {
      if (!fatal) return;
      fatal.style.display = "block";
      fatal.textContent = msg;
    }

    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("visibilitychange", () => SetVisibility(!document.hidden));
    window.addEventListener("blur", () => SetVisibility(false));
    window.addEventListener("focus", () => SetVisibility(true));

    window.addEventListener("pointerdown", () => {
      FocusGame();
      SetVisibility(true);
    });

    const oRequestPointerLock = Element.prototype.requestPointerLock;
    Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
      try {
        (args[0] ||= {}).unadjustedMovement = true;
        await oRequestPointerLock.apply(this, args);
      } catch (err) {
        console.log(err);
      }
    };

    function InstallBlurFocusBlocker() {
      if (!("onblur" in document)) return;
      if (window.blurFocusHandlersInstalled) return;

      window.addEventListener("blur", function() {
        let blockerButton = document.createElement("button");
        blockerButton.style.position = "fixed";
        blockerButton.style.top = "0";
        blockerButton.style.left = "0";
        blockerButton.style.width = "100%";
        blockerButton.style.height = "100%";
        blockerButton.style.zIndex = "9999";
        blockerButton.style.backgroundColor = "rgba(0, 0, 0, 0)";
        blockerButton.style.border = "none";
        blockerButton.style.cursor = "default";

        document.body.appendChild(blockerButton);

        function removeBlocker() {
          if (blockerButton && blockerButton.parentNode) {
            blockerButton.parentNode.removeChild(blockerButton);
          }
          window.removeEventListener("focus", removeBlocker);
        }

        window.addEventListener("focus", removeBlocker);
      });

      window.blurFocusHandlersInstalled = true;
    }

    function FocusGame() {
      if (!isPausedGame) canvas.focus();
    }

    function SetVisibility(visibility) {
      if (ysdk !== null && initGame === true && isVisibility !== visibility) {
        isVisibility = visibility;
        if (!visibility) YG2Instance("SetFocusWindowGame", "false");
        else YG2Instance("SetFocusWindowGame", "true");
      }
    }

    const PauseCallback = () => {
      isPausedGame = true;
      YG2Instance("SetPauseGame", "true");
    };

    const ResumeCallback = () => {
      isPausedGame = false;
      YG2Instance("SetPauseGame", "false");
    };

    function YG2Instance(method) {
      if (ygGameInstance == null) return;
      if (!initGame) {
        setTimeout(function() {
          if (ygGameInstance) ygGameInstance.SendMessage("YG2Instance", method);
        }, 100);
      } else {
        ygGameInstance.SendMessage("YG2Instance", method);
      }
    }

    function YG2Instance(method, arg) {
      if (ygGameInstance == null) return;
      if (!initGame) {
        setTimeout(function() {
          ygGameInstance.SendMessage("YG2Instance", method, arg);
        }, 100);
      } else {
        ygGameInstance.SendMessage("YG2Instance", method, arg);
      }
    }

    function LogStyledMessage(message, style) {
      console.log("%c" + message, style);
    }
    function LogStyledMessage(message) {
      console.log("%c" + message, "color: #FFDF73; background-color: #454545");
    }

    async function headOk(url) {
      try {
        const r = await fetch(url, { method: "HEAD", cache: "no-store" });
        return r.ok;
      } catch (e) {
        return false;
      }
    }

    async function pickBuildUrls() {
      const plain = {
        dataUrl: buildUrl + "/Dune.data",
        frameworkUrl: buildUrl + "/Dune.framework.js",
        codeUrl: buildUrl + "/Dune.wasm"
      };

      const br = {
        dataUrl: buildUrl + "/Dune.data.br",
        frameworkUrl: buildUrl + "/Dune.framework.js.br",
        codeUrl: buildUrl + "/Dune.wasm.br"
      };

      const hasPlain = (await headOk(plain.dataUrl)) && (await headOk(plain.frameworkUrl)) && (await headOk(plain.codeUrl));
      if (hasPlain) return plain;

      const hasBr = (await headOk(br.dataUrl)) && (await headOk(br.frameworkUrl)) && (await headOk(br.codeUrl));
      if (hasBr) return br;

      return br;
    }

    function StartUnityInstance_IfUnloaded() {
      if (spinner.style.display !== "none") StartUnityInstance();
    }

    function IsLocalHost() {
      try {
        if (window.top !== window) return false;
        const host = window.location.hostname;
        if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) {
          LogStyledMessage("Local Host");
          return true;
        }
      } catch (error) {
        console.error("Error checking the local host:", error);
        return false;
      }
    }

    async function InitYSDK() {
      try {
        if (IsLocalHost()) return;

        if (typeof YaGames === "undefined") {
          console.warn("YaGames is not available here, skipping Yandex SDK init.");
          return;
        }

        ysdk = await YaGames.init();
        ysdk.on("game_api_pause", PauseCallback);
        ysdk.on("game_api_resume", ResumeCallback);

        await RequestingEnvironmentData();
        LogStyledMessage("Init EnvirData ysdk");

        await InitPlayer();
        LogStyledMessage("Init Authorization ysdk");

        await LoadCloud();
        LogStyledMessage("Init Storage ysdk");

        await GetStats();
        LogStyledMessage("Init PlayerStats ysdk");

        await InitPayments();
        LogStyledMessage("Init Payments ysdk");

        initYSDK = true;
        if (ygGameInstance != null) ygGameInstance.SendMessage("YG2Instance", "InitSDKComplete");

        LogStyledMessage("Init YandexSDK Success");
      } catch (e) {
        console.error("CRASH Initialization SDK: ", e);
      }

      if (!IsLocalHost() && !syncInit) StartUnityInstance_IfUnloaded();
    }

    function InitGame() {
      initGame = true;
      setTimeout(function() {
        if (isPausedGame == true) YG2Instance("SetPauseGame", "true");
      }, 100);
    }

    LogStyledMessage("[PluginYG2 v2.007] [Build: 12] [Platform: YandexGames]");

    var cloudSaves = NO_DATA;
    function SaveCloud(jsonData, flush) {
      if (player == null) {
        console.error("CRASH Save Cloud: ", "Didnt have time to load");
        return;
      }
      try { player.setData({ saves: [jsonData] }, flush); }
      catch (e) { console.error("CRASH Save Cloud: ", e.message); }
    }

    function LoadCloud() {
      return new Promise((resolve) => {
        if (ysdk == null) { Final(NO_DATA); return; }
        try {
          player.getData(["saves"]).then(data => {
            if (data.saves) Final(JSON.stringify(data.saves));
            else Final(NO_DATA);
          }).catch(() => { console.error("Load Cloud Error!"); Final(NO_DATA); });
        } catch (e) {
          console.error("CRASH Load saves Cloud: ", e.message);
          Final(NO_DATA);
        }
        function Final(res) {
          cloudSaves = res;
          YG2Instance("SetLoadSaves", res);
          resolve(res);
        }
      });
    }

    var statsSaves = NO_DATA;
    function GetStats() {
      return new Promise((resolve) => {
        if (ysdk == null) { Final(NO_DATA); return; }
        try {
          player.getStats().then(stats => { Final(JSON.stringify(stats)); })
            .catch(e => { console.error("GetStats Error!", e.message); Final(NO_DATA); });
        } catch (e) {
          console.error("CRASH GetStats: ", e.message);
          Final(NO_DATA);
        }
        function Final(res) {
          statsSaves = res;
          YG2Instance("ReceiveStats", res);
          resolve(res);
        }
      });
    }

    function SetStats(jsonStats) {
      if (ysdk == null || player == null) { console.error("SetStats: Error initialization"); return; }
      try { player.setStats(JSON.parse(jsonStats)); }
      catch (e) { console.error("CRASH SetStats:", e.message); }
    }

    var paymentsData = NO_DATA;
    let payments = null;

    function InitPayments(sendback) {
      return new Promise((resolve) => {
        try {
          if (ysdk == null) { Final(NO_DATA); return; }

          ysdk.getPayments().then(_payments => {
            payments = _payments;

            payments.getCatalog().then(products => {
              let productID = [], title = [], description = [], imageURI = [], price = [], priceValue = [], priceCurrencyCode = [], currencyImageURL = [], consumed = [];

              payments.getPurchases().then(purchases => {
                for (let i = 0; i < products.length; i++) {
                  productID[i] = products[i].id;
                  title[i] = products[i].title;
                  description[i] = products[i].description;
                  imageURI[i] = products[i].imageURI;
                  price[i] = products[i].price;
                  priceValue[i] = products[i].priceValue;
                  priceCurrencyCode[i] = products[i].priceCurrencyCode;
                  currencyImageURL[i] = products[i].getPriceCurrencyImage("medium");

                  consumed[i] = true;
                  for (i2 = 0; i2 < purchases.length; i2++) {
                    if (purchases[i2].productID === productID[i]) { consumed[i] = false; break; }
                  }
                }

                let jsonPayments = {
                  "id": productID,
                  "title": title,
                  "description": description,
                  "imageURI": imageURI,
                  "price": price,
                  "priceValue": priceValue,
                  "priceCurrencyCode": priceCurrencyCode,
                  "currencyImageURL": currencyImageURL,
                  "consumed": consumed,
                  "language": ysdk.environment.i18n.lang
                };

                Final(JSON.stringify(jsonPayments));
              });
            });
          }).catch(e => {
            LogStyledMessage("Purchases are not available", e.message);
            Final(NO_DATA);
          });
        } catch (e) {
          console.error("CRASH Init Payments: ", e.message);
          Final(NO_DATA);
        }

        function Final(res) {
          paymentsData = res;
          YG2Instance("PaymentsEntries", res);
          resolve(res);
        }
      });
    }

    function boot() {
      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = async () => {
        const picked = await pickBuildUrls();
        const config = {
          ...configBase,
          dataUrl: picked.dataUrl,
          frameworkUrl: picked.frameworkUrl,
          codeUrl: picked.codeUrl
        };

        StartUnityInstance = function() {
          createUnityInstance(canvas, config, (progress) => {
            spinner.style.display = "none";
            progressBarEmpty.style.display = "";
            const adjustedProgress = Math.max(progress, 0.05);
            progressBarFull.style.width = `${100 * adjustedProgress}%`;
          }).then((unityInstance) => {
            ygGameInstance = unityInstance;
            loadingCover.style.background = "";
            loadingCover.style.display = "none";
          }).catch((message) => {
            console.error(message);
            showFatal(String(message || "Unity failed to start."));
          });
        };

        InstallBlurFocusBlocker();
        InitYSDK();

        if (IsLocalHost() || syncInit) StartUnityInstance_IfUnloaded();
      };

      script.onerror = () => showFatal("Failed to load " + loaderUrl);
      document.body.appendChild(script);
    }

    boot();
  </script>
</body>
</html>
